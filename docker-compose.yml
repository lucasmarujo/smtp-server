services:
  mailserver:
    image: ${DMS_IMAGE}
    container_name: mail
    hostname: ${MAIL_HOSTNAME}
    restart: unless-stopped
    stop_grace_period: 1m

    env_file: .env

    ports:
      - "25:25"     # SMTP  - MX / servidor-a-servidor (sem auth, sem relay)
      - "587:587"   # Submission - envio autenticado (STARTTLS obrigatorio)
      - "993:993"   # IMAPS - acesso a caixa postal (TLS implicito)

    volumes:
      - ./docker-data/dms/mail-data/:/var/mail/
      - ./docker-data/dms/mail-state/:/var/mail-state/
      - ./docker-data/dms/mail-logs/:/var/log/mail/
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
      # Certificados TLS emitidos pelo Caddy ja existente no host (somente leitura).
      # Usado apenas quando SSL_TYPE=manual (ver README secao TLS).
      - /opt/proxy/caddy_data/caddy/certificates/:/caddy-certs/:ro

    cap_add:
      - NET_ADMIN            # necessario para o Fail2ban interno

    healthcheck:
      test: "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"
      timeout: 3s
      retries: 0

    networks:
      default:
        # O Roundcube conecta em "mail.marujo.dev" e recebe o certificado
        # Let's Encrypt valido (mesmo nome), sem sair para a internet.
        aliases:
          - mail.marujo.dev

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  roundcube:
    image: ${ROUNDCUBE_IMAGE}
    container_name: roundcube
    hostname: webmail.marujo.dev
    restart: unless-stopped
    depends_on:
      - mailserver

    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: "ssl://mail.marujo.dev"
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: "tls://mail.marujo.dev"
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_DB_TYPE: "sqlite"
      ROUNDCUBEMAIL_PLUGINS: "archive,zipdownload,managesieve,gravatar,twofactor_gauthenticator"
      ROUNDCUBEMAIL_USERNAME_DOMAIN: "${MAIL_DOMAIN}"
      ROUNDCUBEMAIL_DES_KEY: "${ROUNDCUBEMAIL_DES_KEY}"
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: "25M"
      ROUNDCUBEMAIL_TEMP_DIR: "/tmp/roundcube-temp"
      TZ: "${TZ}"

    volumes:
      - ./docker-data/roundcube/www/:/var/www/html/
      - ./docker-data/roundcube/db/:/var/roundcube/db/
      - ./docker-data/roundcube/logs/:/var/www/html/logs/
      - ./config/roundcube/custom.inc.php:/var/roundcube/config/custom.inc.php:ro
      - ./config/roundcube/plugins/gravatar/:/var/www/html/plugins/gravatar/:ro
      - ./config/roundcube/plugins/twofactor_gauthenticator/:/var/www/html/plugins/twofactor_gauthenticator/:ro

    networks:
      default:
      proxy:

    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    name: mail_default
  proxy:
    external: true

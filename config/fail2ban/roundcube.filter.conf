# Filtro do Fail2ban (HOST) para login falho no webmail (Roundcube).
# Copiar para /etc/fail2ban/filter.d/roundcube.conf
#
# Depende de $config['log_driver'] = 'file'; e $config['log_logins'] = true;
# em config/roundcube/custom.inc.php, que gravam cada tentativa em
# docker-data/roundcube/logs/userlogins.log. Formato real observado
# (testado em 2026-08-28):
#
#   [28-Aug-2026 23:27:27 +0000]: <a312b2a1> Failed login for hi@marujo.dev
#   from 172.18.0.8 (X-Forwarded-For: 1.2.3.4) in session a312b2a1... (error: 0)
#
# IMPORTANTE: o "from <ip>" logo apos o usuario e o IP do CONTAINER DO CADDY
# na rede Docker (sempre o mesmo, banir ele nao serve pra nada) - o IP real do
# cliente vem depois, em "(X-Forwarded-For: <ip>)". O regex abaixo captura
# so essa parte.

[Definition]
failregex = ^.*Failed login for .* from \S+ \(X-Forwarded-For: <HOST>\) in session
ignoreregex =
